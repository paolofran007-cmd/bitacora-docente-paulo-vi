<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17324d"><title>Bitácora ESRN Paulo VI</title><link rel="manifest" href="./manifest.webmanifest">
<style>
body{margin:0;background:#f2f5f8;color:#17212b;font-family:system-ui,Arial}header{background:#17324d;color:white;padding:18px}main{max-width:950px;margin:18px auto;padding:0 12px;display:grid;gap:14px}.card{background:white;border:1px solid #d8e0e8;border-radius:12px;padding:16px}h2{font-size:1.1rem;color:#17324d;margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{display:block;font-weight:600;margin:8px 0 4px}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bdc9d5;border-radius:8px;font:inherit}textarea{min-height:100px}button{border:0;border-radius:8px;background:#2563a6;color:white;padding:10px 13px;font-weight:700;margin:8px 6px 0 0}button.alt{background:#e8eef4;color:#17324d}button.del{background:#a83232}.status{color:#334d63;white-space:pre-wrap}.entry{border:1px solid #d8e0e8;border-radius:9px;padding:12px;margin-top:10px}.hidden{display:none!important}.tag{background:#eaf1f8;border-radius:30px;padding:3px 8px;font-size:.8rem}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Bitácora Docente Compartida</h1><p>Área de Ciencias Sociales · ESRN Paulo VI</p></header><main>
<section class="card" id="login"><h2>Ingreso de docentes</h2><p>Usá tu correo institucional autorizado. Cada profesor crea su propia contraseña.</p><div class="grid"><div><label>Correo electrónico</label><input id="email" type="email" autocomplete="username"></div><div><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"></div></div><button id="in">Ingresar</button><button class="alt" id="signup">Crear cuenta</button><button class="alt" id="reset">Recuperar contraseña</button><button class="alt hidden" id="verify">Reenviar verificación</button><p id="loginMsg" class="status"></p></section>
<section class="card hidden" id="work"><p id="who"></p><button class="alt" id="out">Cerrar sesión</button><h2>Registrar clase</h2><div class="grid"><div><label>Fecha</label><input id="date" type="date"></div><div><label>Año y división</label><select id="division"></select></div><div><label>Materia/taller</label><select id="space"></select></div><div><label>Eje/unidad (opcional)</label><input id="axis"></div></div><label>Temas trabajados y actividades</label><textarea id="topic" placeholder="Dictá o escribí el contenido de la clase"></textarea><button id="save">Guardar registro compartido</button><button class="alt" id="clear">Limpiar</button><button class="alt" id="dictate">🎙 Dictar por voz</button><p id="msg" class="status"></p></section>
<section class="card hidden" id="records"><h2>Bitácora compartida</h2><div class="grid"><div><label>Buscar</label><input id="search" placeholder="Tema, docente…"></div><div><label>Filtrar división</label><select id="filter"><option value="">Todas</option></select></div></div><button class="alt" id="csv">Descargar CSV</button><div id="list"></div></section>
</main>
<script>
window.onNativeSpeechResult = function(text) {
  if (text) {
    document.getElementById("topic").value = text;
    document.getElementById("msg").textContent =
      "Revisá materia, división y contenido antes de guardar.";
  }
};

document.addEventListener("click", function(event) {
  const button = event.target.closest("#dictate");
  if (button && window.AndroidSpeech) {
    event.preventDefault();
    event.stopImmediatePropagation();
    window.AndroidSpeech.startListening();
  }
}, true);
</script>
 <script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,sendPasswordResetEmail,sendEmailVerification,signOut} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
import {getFirestore,collection,addDoc,doc,updateDoc,deleteDoc,onSnapshot,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js";
// Reemplazá estos valores por los de tu proyecto Firebase antes de publicar.
const firebaseConfig={apiKey:"AIzaSyCo3zERdnfEes00jUE8Zid1_Qqrt91tobY",authDomain:"bitacora-sociales-paulo-vi.firebaseapp.com",projectId:"bitacora-sociales-paulo-vi",storageBucket:"bitacora-sociales-paulo-vi.firebasestorage.app",messagingSenderId:"457609046257",appId:"1:457609046257:web:eb0301f2df91fd19922150",measurementId:"G-32BPVT88SF"};
const allowed=["cyntia.miran@paulovi.edu.ar","ominetti.gabriel@paulovi.edu.ar","pugliese.josemaria@paulovi.edu.ar","juanpablo.moyano@paulovi.edu.ar","rissopatron.juandaniloefrain@paulovi.edu.ar","namuncura.alexis@paulovi.edu.ar","gianello.orieta@paulovi.edu.ar","melody_loncon@paulovi.edu.ar","paolo.etchepareborda@paulovi.edu.ar"];
const byYear={1:["Geografía","Historia","TCS","TFPC"],2:["TES","TFPC","Geografía","Historia"],3:["EIS","Geografía","Historia"],4:["EIS","Geografía","Historia"],5:["EIS"]};
const $=x=>document.getElementById(x), divs=[];for(let y=1;y<=5;y++)for(let d=1;d<=3;d++)divs.push(`${y}°${d}°`);
$("division").innerHTML=divs.map(x=>`<option>${x}</option>`).join("");$("filter").innerHTML+="";
for(const d of divs)$("filter").insertAdjacentHTML("beforeend",`<option>${d}</option>`);
function updateSpaces(v=""){let a=byYear[+$("division").value[0]];$("space").innerHTML='<option value="">Elegí materia/taller</option>'+a.map(x=>`<option>${x}</option>`).join("");if(a.includes(v))$("space").value=v}
$("division").onchange=()=>updateSpaces();updateSpaces();$("date").value=new Date().toLocaleDateString("en-CA");
let auth,db,all=[],editing=null,unsub=null,user=null;
function allowedUser(e){return allowed.includes((e||"").trim().toLowerCase())}
function status(s){$("loginMsg").textContent=s}
function ready(){return !!firebaseConfig.apiKey && !!firebaseConfig.projectId && !!firebaseConfig.appId}
if(ready()){
 const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);
 onAuthStateChanged(auth,u=>{user=u;if(u&&u.emailVerified&&allowedUser(u.email)){ $("login").classList.add("hidden");$("work").classList.remove("hidden");$("records").classList.remove("hidden");$("who").textContent="Sesión: "+u.email+" · Registros compartidos del área.";if(unsub)unsub();unsub=onSnapshot(query(collection(db,"bitacora"),orderBy("fecha","desc")),s=>{all=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>{$("msg").textContent="No se pudieron leer los registros. Revisá las reglas de Firestore."});}else{$("login").classList.remove("hidden");$("work").classList.add("hidden");$("records").classList.add("hidden");if(unsub){unsub();unsub=null}if(u&&!allowedUser(u.email)){status("Este correo no está autorizado para la bitácora.");signOut(auth)}else if(u&&!u.emailVerified){status("Tu correo todavía no está verificado. Pulsá «Reenviar verificación» y revisá la bandeja de entrada y correo no deseado.");$("verify").classList.remove("hidden")}else{$("verify").classList.add("hidden")}}});
 $("in").onclick=async()=>{let e=$("email").value.trim().toLowerCase();if(!allowedUser(e))return status("Correo no autorizado.");try{const cred=await signInWithEmailAndPassword(auth,e,$("password").value);if(!cred.user.emailVerified){$("verify").classList.remove("hidden");status("La cuenta existe, pero falta verificar el correo. Pulsá «Reenviar verificación».");}}catch(x){status(errorMsg(x))}};
 $("verify").onclick=async()=>{try{if(!auth.currentUser)return status("Primero ingresá con tu correo y contraseña.");await sendEmailVerification(auth.currentUser);await signOut(auth);$("verify").classList.add("hidden");status("Te enviamos un enlace de verificación. Abrilo desde tu correo y luego ingresá nuevamente.")}catch(x){status(errorMsg(x))}};
 $("signup").onclick=async()=>{let e=$("email").value.trim().toLowerCase(),p=$("password").value;if(!allowedUser(e))return status("Correo no autorizado.");if(p.length<8)return status("Usá al menos 8 caracteres.");try{const cred=await createUserWithEmailAndPassword(auth,e,p);await sendEmailVerification(cred.user);await signOut(auth);status("Cuenta creada. Revisá tu correo y confirmá la dirección antes de ingresar.")}catch(x){status(errorMsg(x))}};
 $("reset").onclick=async()=>{let e=$("email").value.trim().toLowerCase();if(!allowedUser(e))return status("Escribí un correo autorizado.");try{await sendPasswordResetEmail(auth,e);status("Revisá tu correo para recuperar la contraseña.")}catch(x){status(errorMsg(x))}};
 $("out").onclick=()=>signOut(auth);
}else{status("Falta configurar Firebase. Consultá LEEME_CONFIGURACION.txt antes de publicar.")}
function errorMsg(x){return ({ "auth/email-already-in-use":"La cuenta ya existe: ingresá o recuperá la contraseña.","auth/invalid-credential":"Correo o contraseña incorrectos.","auth/operation-not-allowed":"Habilitá Email/Password en Firebase Authentication.","auth/weak-password":"Usá una contraseña más segura."})[x.code]||x.message}
$("clear").onclick=()=>{editing=null;$("date").value=new Date().toLocaleDateString("en-CA");$("division").selectedIndex=0;updateSpaces();$("axis").value="";$("topic").value="";$("save").textContent="Guardar registro compartido"};
$("save").onclick=async()=>{let payload={fecha:$("date").value,division:$("division").value,espacio:$("space").value,eje:$("axis").value.trim(),tema:$("topic").value.trim(),actualizadoPor:user.email,actualizadoEn:serverTimestamp()};if(!payload.fecha||!payload.espacio||!payload.tema)return $("msg").textContent="Completá fecha, materia y temas.";try{if(editing)await updateDoc(doc(db,"bitacora",editing),payload);else{payload.creadoPor=user.email;payload.creadoEn=serverTimestamp();await addDoc(collection(db,"bitacora"),payload)}$("msg").textContent="Registro guardado y compartido."; $("clear").click()}catch(e){$("msg").textContent="Error al guardar: "+e.message}};
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){let q=$("search").value.toLowerCase(),f=$("filter").value,a=all.filter(r=>(!f||r.division===f)&&(!q||[r.fecha,r.division,r.espacio,r.eje,r.tema,r.creadoPor,r.actualizadoPor].join(" ").toLowerCase().includes(q)));$("list").innerHTML=a.length?a.map(r=>`<article class="entry"><span class="tag">${esc(r.division)}</span> <b>${esc(r.espacio)}</b> · ${esc(r.fecha)}<p>${r.eje?'<b>Eje:</b> '+esc(r.eje)+'<br>':''}${esc(r.tema)}</p><small>Cargó: ${esc(r.creadoPor||"")} · Editó: ${esc(r.actualizadoPor||"")}</small><br><button class="alt" data-e="${r.id}">Editar</button><button class="del" data-d="${r.id}">Eliminar</button></article>`).join(""):'<p>Aún no hay registros.</p>';document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{let r=all.find(x=>x.id===b.dataset.e);editing=r.id;$("date").value=r.fecha;$("division").value=r.division;updateSpaces(r.espacio);$("axis").value=r.eje||"";$("topic").value=r.tema||"";$("save").textContent="Guardar cambios compartidos";window.scrollTo(0,0)});document.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(confirm("¿Eliminar este registro para todos?"))await deleteDoc(doc(db,"bitacora",b.dataset.d))})}
$("search").oninput=render;$("filter").onchange=render;$("csv").onclick=()=>{let cols=["fecha","division","espacio","eje","tema","creadoPor","actualizadoPor"],q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';let s=[cols.join(";"),...all.map(r=>cols.map(k=>q(r[k])).join(";"))].join("\r\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+s],{type:"text/csv;charset=utf-8"}));a.download="bitacora_esrn.csv";a.click()};
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function parseDiv(s){let n=norm(s),m=n.match(/\b([1-5])\s*(?:°|º|o)?\s*(?:ano\s*)?(?:division\s*)?([1-3])\b/);if(m)return `${m[1]}°${m[2]}°`;for(let [w,y] of [["primero",1],["primera",1],["segundo",2],["segunda",2],["tercero",3],["tercera",3],["cuarto",4],["cuarta",4],["quinto",5],["quinta",5]]){let i=n.indexOf(w);if(i>=0){let m2=n.slice(i+w.length).match(/\b(primera|primero|segunda|segundo|tercera|tercero|1|2|3)\b/);if(m2){let d=({"primera":1,"primero":1,"segunda":2,"segundo":2,"tercera":3,"tercero":3})[m2[1]]||+m2[1];return `${y}°${d}°`}}}return null}
$("dictate").onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return $("msg").textContent="Tu navegador no ofrece dictado integrado; usá el micrófono del teclado del celular.";let r=new SR();r.lang="es-AR";r.onresult=e=>{let s=e.results[0][0].transcript,n=norm(s),d=parseDiv(s),space=["Geografía","Historia","TCS","TFPC","TES","EIS"].find(x=>n.includes(norm(x)));if(d){$("division").value=d;updateSpaces(space)}if(space&&byYear[+$("division").value[0]].includes(space))$("space").value=space;$("topic").value=s;$("msg").textContent="Revisá materia, división y contenido antes de guardar."};r.start()};
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
